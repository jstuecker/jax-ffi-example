[build-system]
build-backend = "scikit_build_core.build"
requires = ["scikit-build-core>=0.11", "nanobind>=2.9.2"]

[project]
name = "jax-ffi-example"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "jax",
    "numpy>=2.2.6"
]

[tool.scikit-build]
cmake.version = ">=3.24"
build-dir = "build"
logging.level = "INFO"
build.requires = ["jax", "scikit-build-core>=0.11", "nanobind>=2.9.2", "cmake>=3.24"]
editable.rebuild = false